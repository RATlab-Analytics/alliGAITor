name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# A tag push uploads its build straight to that tag's release (which must
# already exist -- `gh release create <tag>` with no files, then push the
# tag) via `gh release upload`, which needs write access to contents.
permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build .app
        run: pyinstaller packaging/alligaitor.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: alliGAITor-macos-arm64
          path: dist/alliGAITor.app
      - name: Zip .app for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: ditto -c -k --sequesterRsrc --keepParent dist/alliGAITor.app dist/alliGAITor-macos-arm64.zip
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/alliGAITor-macos-arm64.zip --clobber

  windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build .exe
        run: pyinstaller packaging/alligaitor.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: alliGAITor-windows-x86_64
          path: dist/alliGAITor
      - name: Zip build for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path dist/alliGAITor -DestinationPath dist/alliGAITor-windows-x86_64.zip
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/alliGAITor-windows-x86_64.zip --clobber

  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 fuse libfuse2 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build
        run: pyinstaller packaging/alligaitor.spec --noconfirm
      - name: Download appimagetool
        run: |
          curl -L -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x appimagetool
      - name: Build AppImage
        env:
          APPIMAGETOOL: ${{ github.workspace }}/appimagetool
          ARCH: ${{ matrix.arch }}
        run: |
          ./appimagetool --appimage-extract
          ./squashfs-root/AppRun --version || true
          APPIMAGETOOL="./squashfs-root/AppRun" ARCH="${{ matrix.arch }}" packaging/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: alliGAITor-linux-${{ matrix.arch }}
          path: dist/alliGAITor-*.AppImage
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/alliGAITor-*.AppImage --clobber
