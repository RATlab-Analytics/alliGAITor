# alliGAITor pipeline config for the 2026-08-13 calibration recording.
#
# Camera mapping for this rig (confirmed 2026-08-13): cam2 is bottom;
# cam0/cam1 are the two side cameras. Which of cam0/cam1 is "left" vs
# "right" is arbitrary (the side model is used for both roles either way)
# -- swap them below if it turns out to matter for your session videos'
# own left/right convention.
#
# Uses the H.264 "coded" re-encodes (calibration_video_260813-132431/coded/)
# rather than the raw MJPEG captures: the raw files carry a capture-side bug
# where each frame's PTS is stamped with wall-clock epoch time instead of a
# relative timebase, which confuses players/tools and needs to be fixed at
# the source (the v4l2 capture script) rather than worked around per file.
# A true-lossless re-encode was tried and compared against these coded
# files directly -- not enough of a quality difference over "coded" to be
# worth the 1-1.5GB/camera file size for calibration purposes.
#
# Run with:
#   python -m alligaitor.cli calibrate configs/calibration_260813.yaml
#
# Add gait-recording sessions under `sessions:` below (see
# configs/session_example.yaml for the schema) once you're ready to run
# the full 3D pipeline against real footage using this calibration.

models:
  side_model_dir: "../models/alliGAITor_side_ConvNeXt_slim_v1.0.0.n=315"
  bottom_model_dir: "../models/alliGAITor_bottom_slim_v0.4.1-beta"

calibration:
  videos:
    left: "../calibration_video_260813-132431/coded/calibration_cam0_coded.mp4"
    right: "../calibration_video_260813-132431/coded/calibration_cam1_coded.mp4"
    bottom: "../calibration_video_260813-132431/coded/calibration_cam2_coded.mp4"
  output_path: "../calibration/calibration.toml"

sessions: []
