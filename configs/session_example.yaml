# Example alliGAITor pipeline configuration.
#
# Paths are resolved relative to this file's directory unless given as
# absolute paths. Copy this file, fill in your own sessions, and pass it
# to the CLI:
#
#   python -m alligaitor.cli calibrate configs/my_config.yaml
#   python -m alligaitor.cli run configs/my_config.yaml --device mps
#
# Camera role assignment (left / right / bottom) is per session: the
# physical camera that lands on a given recording's cam0/cam1/cam2 is not
# consistent across sessions, so each session lists its own video for each
# role rather than relying on a fixed camera index.
#
# This file is one "group": `run` triangulates every session below and
# writes one gait-metrics workbook (`output_xlsx`) with one tab per
# distinct `rat_id`. `name` and `output_xlsx` are both optional --
# `name` defaults to this file's stem, and `output_xlsx` defaults to
# `reports/<name>.gait_metrics.xlsx` next to this file. `gait` is also
# optional; see alligaitor/config.py's GaitConfig for the stance/swing
# detection thresholds it can override.

name: "session_example"
output_xlsx: "../reports/session_example.gait_metrics.xlsx"

models:
  side_model_dir: "../models/alliGAITor_side_ConvNeXt_color_v2.1.0.n494"
  bottom_model_dir: "../models/alliGAITor_bottom_color_v2.6.0.n252"

calibration:
  # Mirrors configs/calibration_april01.yaml -- the AprilTag marker-grid
  # board, the current calibration method for this rig (it supersedes the
  # ChArUco boards for the bottom camera's steep tunnel-slit view; see
  # alligaitor/calibration.py's board_preset docs). Captured once per rig
  # and reused across sessions; re-record and re-run `calibrate` if a
  # camera is bumped or repositioned.
  videos:
    left: "../videos/april_cal_coded/april01_cam0_coded.mp4"
    right: "../videos/april_cal_coded/april01_cam1_coded.mp4"
    bottom: "../videos/april_cal_coded/april01_cam2_coded.mp4"
  output_path: "../calibration/calibration_april01.toml"
  board_preset: "apriltag"

sessions:
  # rat_id groups sessions onto the same spreadsheet tab -- it defaults to
  # `name` (each session its own rat) when omitted, so set it explicitly
  # whenever a rat crosses the platform more than once in this group.
  #
  # left/right below (cam0=left) is visually verified, not assumed: this
  # rig has a black-and-white patterned patch on one wall, visible in the
  # uncropped source recordings (not in these cropped strips -- see
  # scripts/check_camera_side.py), only from the camera on that side.
  # cam0 shows it in both sessions below AND in the april01 calibration
  # recording, so "left" is consistently the same physical camera across
  # all three -- no port swap between calibration and these two sessions.
  # This does NOT extend to other recordings not checked this way; re-verify
  # per session if ports may have been touched, since capture-port order
  # isn't guaranteed stable across recordings in general.
  - name: "359a-BL"
    rat_id: "359"
    output_dir: "../predictions_3d/359a-BL"
    videos:
      left: "../videos/side-training-data/359a-BL_cam0_coded.mp4"
      right: "../videos/side-training-data/359a-BL_cam2_coded.mp4"
      bottom: "../videos/bottom_training_data_cropped/359a-BL_cam1_coded.mp4"

  - name: "359c-pu2"
    rat_id: "359"
    output_dir: "../predictions_3d/359c-pu2"
    videos:
      left: "../videos/side-training-data/359c-pu2_cam0_coded.mp4"
      right: "../videos/side-training-data/359c-pu2_cam1_coded.mp4"
      bottom: "../videos/bottom_training_data_cropped/359c-pu2_cam2_coded.mp4"

  # left/right for the four sessions below verified the same way (camo
  # wall visible only in cam0's panel, see videos/diagnostics/*_camcheck.png)
  # -- added to sample right-forepaw coverage across more than one trial.
  - name: "360a-PU"
    rat_id: "360"
    output_dir: "../predictions_3d/360a-PU"
    videos:
      left: "../videos/side-training-data/360a-PU_cam0_coded.mp4"
      right: "../videos/side-training-data/360a-PU_cam1_coded.mp4"
      bottom: "../videos/bottom_training_data_cropped/360a-PU_cam2_coded.mp4"

  - name: "365a-BTX"
    rat_id: "365"
    output_dir: "../predictions_3d/365a-BTX"
    videos:
      left: "../videos/side-training-data/365a-BTX_cam0_coded.mp4"
      right: "../videos/side-training-data/365a-BTX_cam1_coded.mp4"
      bottom: "../videos/bottom_training_data_cropped/365a-BTX_cam2_coded.mp4"

  - name: "370a-btx"
    rat_id: "370"
    output_dir: "../predictions_3d/370a-btx"
    videos:
      left: "../videos/side-training-data/370a-btx_cam0_coded.mp4"
      right: "../videos/side-training-data/370a-btx_cam1_coded.mp4"
      bottom: "../videos/bottom_training_data_cropped/370a-btx_cam2_coded.mp4"

  - name: "377a-PU"
    rat_id: "377"
    output_dir: "../predictions_3d/377a-PU"
    videos:
      left: "../videos/side-training-data/377a-PU_cam0_coded.mp4"
      right: "../videos/side-training-data/377a-PU_cam1_coded.mp4"
      bottom: "../videos/bottom_training_data_cropped/377a-PU_cam2_coded.mp4"

  # left/right for the four sessions below verified the same way (camo
  # wall visible only in cam0's panel) -- added to reach 10 sessions for
  # the side-model triangulation drop-rate comparison.
  - name: "361a-pu2"
    rat_id: "361"
    output_dir: "../predictions_3d/361a-pu2"
    videos:
      left: "../videos/side-training-data/361a-pu2_cam0_coded.mp4"
      right: "../videos/side-training-data/361a-pu2_cam1_coded.mp4"
      bottom: "../videos/bottom_training_data_cropped/361a-pu2_cam2_coded.mp4"

  - name: "368a-BL"
    rat_id: "368"
    output_dir: "../predictions_3d/368a-BL"
    videos:
      left: "../videos/side-training-data/368a-BL_cam0_coded.mp4"
      right: "../videos/side-training-data/368a-BL_cam2_coded.mp4"
      bottom: "../videos/bottom_training_data_cropped/368a-BL_cam1_coded.mp4"

  - name: "372a-BL"
    rat_id: "372"
    output_dir: "../predictions_3d/372a-BL"
    videos:
      left: "../videos/side-training-data/372a-BL_cam0_coded.mp4"
      right: "../videos/side-training-data/372a-BL_cam1_coded.mp4"
      bottom: "../videos/bottom_training_data_cropped/372a-BL_cam2_coded.mp4"

  - name: "378a-pu"
    rat_id: "378"
    output_dir: "../predictions_3d/378a-pu"
    videos:
      left: "../videos/side-training-data/378a-pu_cam0_coded.mp4"
      right: "../videos/side-training-data/378a-pu_cam1_coded.mp4"
      bottom: "../videos/bottom_training_data_cropped/378a-pu_cam2_coded.mp4"
