# Example alliGAITor pipeline configuration.
#
# Paths are resolved relative to this file's directory unless given as
# absolute paths. Copy this file, fill in your own sessions, and pass it
# to the CLI:
#
#   python -m alligaitor.cli calibrate configs/my_config.yaml
#   python -m alligaitor.cli run configs/my_config.yaml --device mps
#
# Camera role assignment (left / right / bottom) is per session: the
# physical camera that lands on a given recording's cam0/cam1/cam2 is not
# consistent across sessions, so each session lists its own video for each
# role rather than relying on a fixed camera index.

models:
  side_model_dir: "../models/alliGAITor_side_ConvNeXt_slim_v1.0.0.n=315"
  bottom_model_dir: "../models/alliGAITor_bottom_slim_v0.4.1-beta"

calibration:
  # ChArUco board recordings, one per camera role, captured once for the
  # rig and reused across sessions. Re-record and re-run `calibrate` if a
  # camera is bumped or repositioned.
  videos:
    left: "../calibration/left.mp4"
    right: "../calibration/right.mp4"
    bottom: "../calibration/bottom.mp4"
  output_path: "../calibration/calibration.toml"

sessions:
  - name: "359a-BL"
    output_dir: "../predictions_3d/359a-BL"
    videos:
      left: "../side-training-data/359a-BL_cam0_coded.mp4"
      right: "../side-training-data/359a-BL_cam2_coded.mp4"
      bottom: "../bottom_training_data_cropped/359a-BL_cam1_coded.mp4"

  - name: "359c-pu2"
    output_dir: "../predictions_3d/359c-pu2"
    videos:
      left: "../side-training-data/359c-pu2_cam0_coded.mp4"
      right: "../side-training-data/359c-pu2_cam1_coded.mp4"
      bottom: "../bottom_training_data_cropped/359c-pu2_cam2_coded.mp4"
