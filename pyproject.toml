[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alligaitor"
version = "0.1.0"
description = "Multi-camera 3D gait reconstruction pipeline for rats"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "aniposelib>=0.8.0",
    "sleap-io>=0.9.0",
    "numpy",
    "pandas",
    "openpyxl",
    "PyYAML",
    "imageio-ffmpeg",
    "tqdm",
    "PySide6",
    "opencv-python",
]

[project.scripts]
alligaitor = "alligaitor.cli:main"

[project.gui-scripts]
alligaitor-gui = "gui.app:main"

[tool.setuptools]
packages = ["alligaitor", "gui", "tools"]
